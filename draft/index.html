<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POG 指名会</title>
<!-- iPhoneのホーム画面用（名前とアイコン） -->
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="POG指名会">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1f5c3f">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../favicon.png">
<style>
  html, body { margin: 0; height: 100%; background: #1f5c3f; }
  body { color: #fff; font-family: -apple-system, "Hiragino Sans", sans-serif; }
  .guide { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 32px 24px; box-sizing: border-box; text-align: center; }
  .guide img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .guide h1 { margin: 4px 0 0; font-size: 24px; }
  .steps { background: rgba(255,255,255,.1); border-radius: 14px; padding: 14px 18px; text-align: left; font-size: 15px; line-height: 1.9; max-width: 340px; }
  .steps b { color: #f2d77a; }
  .open { display: inline-block; margin-top: 4px; padding: 13px 26px; border-radius: 12px; background: #f2d77a; color: #1d2420;
    font-weight: 800; text-decoration: none; }
  .small { font-size: 12px; opacity: .75; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #f4f1ea; }
  .fallback { position: fixed; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom)); text-align: center; z-index: 5; display: none; }
  .fallback a { background: rgba(0,0,0,.65); color: #fff; padding: 8px 14px; border-radius: 999px; font-size: 13px; text-decoration: none; }
</style>
</head>
<body data-page="draft">
<div class="guide" id="guide">
  <img src="../apple-touch-icon.png" alt="">
  <h1 id="ttl">POG 指名会</h1>
  <div class="steps">
    <div>📱 <b>ホーム画面に追加</b>するとアプリのように使えます</div>
    <div>① 下の共有ボタン（□に↑）をタップ</div>
    <div>②「ホーム画面に追加」→「追加」</div>
  </div>
  <a class="open" id="open" href="#">今すぐ開く</a>
  <div class="small">追加したアイコンから開くと全画面で表示されます</div>
</div>
<div class="fallback" id="fallback"><a id="direct" href="#" target="_blank" rel="noopener">開かない場合はこちら</a></div>
<script>
  // アプリ本体（Google Apps Script）の公開URL。サーバーを移すときはここだけ変える
  var APP_URL = 'https://script.google.com/macros/s/AKfycbwS9DtNTD4auxtbE2y6H8KTRpNCx42r93NSyiuwPIh9NdQ6OKefYK_UzmVT5zDPziN7/exec';
  var page = document.body.getAttribute('data-page') || '';
  var url = APP_URL + (page ? '?page=' + page : '');
  document.getElementById('open').href = url;
  document.getElementById('direct').href = url;
  var standalone = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (standalone) {
    // ホーム画面のアイコンから開いたとき：アプリを全画面で表示
    document.getElementById('guide').style.display = 'none';
    var f = document.createElement('iframe');
    f.src = url;
    document.body.appendChild(f);
    // 表示できなかったとき用のリンク（4秒後〜15秒後まで表示）
    var fb = document.getElementById('fallback');
    setTimeout(function () { fb.style.display = 'block'; }, 4000);
    setTimeout(function () { fb.style.display = 'none'; }, 15000);
  }
</script>
</body>
</html>
